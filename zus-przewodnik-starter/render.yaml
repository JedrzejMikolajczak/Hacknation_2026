# Render Blueprint – backend API (Express). Frontend jest na Netlify (patrz netlify.toml).
services:
  - type: web
    name: zus-przewodnik-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm run start -w server
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NPM_CONFIG_PRODUCTION
        value: "false"   # tsx (uruchamia TypeScript) jest w devDependencies
      - key: CLIENT_ORIGIN
        value: https://TWOJA-NAZWA.netlify.app
      - key: ADMIN_TOKEN
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false      # wpisz w panelu Render (opcjonalne – bez klucza działa tryb demo)
